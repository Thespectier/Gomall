syntax="proto3";

package user;

option go_package="/user";

message RegisterReq {
    string user_name = 1;
    string email = 2;
    string password = 3;
    string confirm_password = 4;
}

message RegisterResp {
    int32 user_id = 1;
}

message LoginReq {
    string user_name = 1;
    string password = 2;
}

message LoginResp {
    int32 user_id = 1;
}

service UserService {
    rpc Register(RegisterReq) returns (RegisterResp) {}
    rpc Login(LoginReq) returns (LoginResp) {}
}